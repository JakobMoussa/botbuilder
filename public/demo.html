<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snippet Live-Test Preview</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 700px;
      width: 100%;
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    h1 { margin-top: 0; color: #1e293b; }
    p { color: #64748b; line-height: 1.6; }
    .input-group {
      margin: 20px 0;
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
    }
    button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #4f46e5; }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      background: #e0e7ff;
      color: #3730a3;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="container">
  <span class="badge">Live Test Modus</span>
  <h1>Vorschau deines Chatbots</h1>
  <p>Gib unten deine <strong>Bot-ID</strong> ein, um das Widget live auf dieser Beispielseite zu laden:</p>
  
  <div class="input-group">
    <input type="text" id="botIdInput" placeholder="Z. B. clx... oder Bot Public ID" />
    <button onclick="loadWidget()">Widget laden</button>
  </div>
</div>

<script>
  // Auto-fill from URL param if available (?botId=XXX)
  const urlParams = new URLSearchParams(window.location.search);
  const paramBotId = urlParams.get('botId');
  if (paramBotId) {
    document.getElementById('botIdInput').value = paramBotId;
    loadScript(paramBotId);
  }

  function loadWidget() {
    const id = document.getElementById('botIdInput').value.trim();
    if (!id) return alert('Bitte gib eine Bot ID ein.');
    
    // Update URL query string
    const newUrl = window.location.pathname + '?botId=' + encodeURIComponent(id);
    window.history.pushState({path: newUrl}, '', newUrl);

    loadScript(id);
  }

  function loadScript(botId) {
    // Remove existing script/widget if re-loaded
    const existingScript = document.getElementById('dialogue-snippet');
    if (existingScript) existingScript.remove();

    const existingWidget = document.querySelector(`[data-dialogue-widget="${botId}"]`);
    if (existingWidget) existingWidget.remove();

    const script = document.createElement('script');
    script.id = 'dialogue-snippet';
    script.src = '/chatbot.js';
    script.setAttribute('data-bot-id', botId);
    script.async = true;
    document.body.appendChild(script);
  }
</script>

</body>
</html>
